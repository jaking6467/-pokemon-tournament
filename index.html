<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéTourney 2025 - Real-time Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-navy': '#0a1020',
                        'neon-yellow': '#ffd700',
                        'neon-cyan': '#00d2ff',
                        'panel-bg': 'rgba(23, 33, 56, 0.8)',
                        'panel-border': 'rgba(255, 255, 255, 0.1)',
                        'win-green': '#22c55e',
                        'loss-red': '#ef4444'
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a1020;
            background: radial-gradient(circle at 50% 0%, #1a253a 0%, #0a1020 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a1020;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(23, 33, 56, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .neon-text-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .match-pill {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .glow-box {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            border: 1px solid #ffd700;
        }

        .sync-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #43e97b;
            animation: pulse 2s infinite;
        }

        .sync-indicator.disconnected {
            background: #f5576c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .group-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .group-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 45px rgba(0, 212, 255, 0.3);
        }

        .group-card.active .group-body {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bracket-line {
            background: #00d2ff;
            box-shadow: 0 0 5px #00d2ff;
        }

        .knockout-bracket {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 40px;
            min-height: 400px;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 20px;
        }

        .bracket-match {
            background: rgba(23, 33, 56, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .bracket-match:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .bracket-match.winner {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 20px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 212, 255, 0.3);
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #00d2ff;
            border-bottom-color: #00d2ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .knockout-bracket {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

        // Initialize Firebase
        function initializeFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                dataRef = database.ref('tournament');

                updateSyncStatus('connected', 'เชื่อมต่อแล้ว');

                const connectedRef = database.ref('.info/connected');
                connectedRef.on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        updateSyncStatus('connected', 'เชื่อมต่อแล้ว');
                    } else {
                        updateSyncStatus('disconnected', 'ไม่ได้เชื่อมต่อ');
                    }
                });

                dataRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.scores) teamsScores = data.scores;
                        if (data.matches) matches = data.matches;
                        if (data.knockout) knockoutData = data.knockout;
                        renderGroups();
                        renderKnockoutBracket();
                    } else {
                        initializeData();
                    }
                });

                return true;
            } catch (error) {
                console.error('Firebase initialization error:', error);
                updateSyncStatus('disconnected', 'เกิดข้อผิดพลาด');
                return false;
            }
        }

        function updateSyncStatus(status, text) {
            const indicator = document.getElementById('syncIndicator');
            const syncText = document.getElementById('syncText');
            
            if (status === 'connected') {
                indicator.classList.remove('disconnected');
            } else {
                indicator.classList.add('disconnected');
            }
            syncText.textContent = text;
        }

        function initializeData() {
            Object.keys(groupsData).forEach(group => {
                matches[group] = {
                    match1: { team1: null, team2: null, winner: null },
                    match2: { team1: null, team2: null, winner: null },
                    match3: { team1: null, team2: null, winner: null },
                    match4: { team1: null, team2: null, winner: null }
                };

                groupsData[group].teams.forEach(team => {
                    teamsScores[team] = { 
                        match1: 0, 
                        match2: 0, 
                        match3: 0, 
                        match4: 0, 
                        total: 0 
                    };
                });
            });

            saveToFirebase();
        }

        function saveToFirebase() {
            if (dataRef) {
                dataRef.set({
                    scores: teamsScores,
                    matches: matches,
                    knockout: knockoutData,
                    lastUpdated: Date.now()
                }).catch(error => {
                    console.error('Error saving to Firebase:', error);
                });
            }
        }

        function renderGroups() {
            const container = document.getElementById('groupsContainer');

            Object.keys(groupsData).forEach(groupKey => {

                            match1: 0, 
                            match2: 0, 
                            match3: 0, 
                            match4: 0, 
                            total: 0 
                        };

                const sortedTeams = [...group.teams].sort((a, b) => {
                    return (teamsScores[b]?.total || 0) - (teamsScores[a]?.total || 0);

                const groupCard = document.createElement('div');

        function toggleGroup(element) {
            const isActive = element.classList.contains('active');
            const allCards = document.querySelectorAll('.group-card');
            
            allCards.forEach(card => {
                card.classList.remove('active');
                const body = card.querySelector('.group-body');
                const icon = card.querySelector('.absolute.bottom-2');
                if (body) body.style.display = 'none';
                if (icon) icon.style.transform = 'rotate(0deg)';
            });
            
            if (!isActive) {
                element.classList.add('active');
                const body = element.querySelector('.group-body');
                const icon = element.querySelector('.absolute.bottom-2');
                if (body) body.style.display = 'block';
                if (icon) icon.style.transform = 'rotate(180deg)';
            }
        }

            const knockoutView = document.getElementById('knockoutView');
            const btnGroups = document.getElementById('btnGroups');
            const btnKnockout = document.getElementById('btnKnockout');

            if (view === 'groups') {

                btnKnockout.className = 'hidden md:block px-4 py-2 rounded-lg bg-slate-700 text-gray-300 hover:bg-slate-600 transition-all';

        // Admin Functions
        function openAdminModal() {
            if (isAdmin) {
                openAdminDashboard();
            } else {
                document.getElementById('adminModal').classList.add('active');
            }
        }

        function verifyAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                closeModal('adminModal');
                openAdminDashboard();
            } else {
                alert('รหัสผ่านไม่ถูกต้อง!');
            }
        }

        function openAdminDashboard() {
            setTimeout(() => {
                populateGroupSelects();
                updateTeamSelect();
                updateMatchList();
                renderQualifierSelection();
            }, 100);
            document.getElementById('adminDashboard').classList.add('active');
        }

        function populateGroupSelects() {
            const selects = ['editGroup', 'matchGroup'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    select.innerHTML = Object.keys(groupsData).map(key => 
                        `<option value="${key}">${groupsData[key].name}</option>`
                    ).join('');
                }
            });
        }

        function updateTeamSelect() {
            const groupSelect = document.getElementById('editGroup');
            const teamSelect = document.getElementById('editTeam');
            
            if (!groupSelect || !teamSelect) return;
            
            const groupKey = groupSelect.value;
            if (!groupKey || !groupsData[groupKey]) return;
            
            teamSelect.innerHTML = groupsData[groupKey].teams.map(team => 
                `<option value="${team}">${team}</option>`
            ).join('');

            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            const teamSelect = document.getElementById('editTeam');
            const matchSelect = document.getElementById('editMatch');
            const scoreDisplay = document.getElementById('scoreDisplay');
            
            if (!teamSelect || !matchSelect || !scoreDisplay) return;
            
            const selectedTeam = teamSelect.value;
            const selectedMatch = matchSelect.value;
            
            if (!teamsScores[selectedTeam]) {
                teamsScores[selectedTeam] = { 
                    match1: 0, 
                    match2: 0, 
                    match3: 0, 
                    match4: 0, 
                    total: 0 
                };
            }
            
            currentScore = teamsScores[selectedTeam][selectedMatch] || 0;
            scoreDisplay.textContent = currentScore;
        }

        function updateMatchTeamSelects() {
            const groupKey = document.getElementById('matchGroup')?.value;
            if (!groupKey || !groupsData[groupKey]) return;
            
            const teams = groupsData[groupKey].teams;
            
            ['team1Select', 'team2Select'].forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    select.innerHTML = teams.map(team => 
                        `<option value="${team}">${team}</option>`
                    ).join('');
                }
            });
        }

        function changeScore(delta) {
            currentScore = Math.max(0, currentScore + delta);
            document.getElementById('scoreDisplay').textContent = currentScore;
        }

        function saveScore() {
            const teamSelect = document.getElementById('editTeam');
            const matchSelect = document.getElementById('editMatch');
            
            if (!teamSelect || !matchSelect) {
                alert('เกิดข้อผิดพลาด: ไม่พบข้อมูล');
                return;
            }
            
            const team = teamSelect.value;
            const match = matchSelect.value;
            
            if (!team || !match) {
                alert('กรุณาเลือกทีมและแมทช์');
                return;
            }
            
            if (!teamsScores[team]) {
                teamsScores[team] = { 
                    match1: 0, 
                    match2: 0, 
                    match3: 0, 
                    match4: 0, 
                    total: 0 
                };
            }
            
            teamsScores[team][match] = currentScore;
            teamsScores[team].total = (teamsScores[team].match1 || 0) + 
                                        (teamsScores[team].match2 || 0) + 
                                        (teamsScores[team].match3 || 0) + 
                                        (teamsScores[team].match4 || 0);
            
            saveToFirebase();
            alert('✅ บันทึกคะแนนสำเร็จ!');
        }

        function resetScore() {
            const teamSelect = document.getElementById('editTeam');
            const matchSelect = document.getElementById('editMatch');
            
            if (!teamSelect || !matchSelect) return;
            
            const team = teamSelect.value;
            const match = matchSelect.value;
            
            if (confirm(`ต้องการลบคะแนน ${match} ของทีม ${team} ใช่หรือไม่?`)) {
                if (!teamsScores[team]) {
                    teamsScores[team] = { 
                        match1: 0, 
                        match2: 0, 
                        match3: 0, 
                        match4: 0, 
                        total: 0 
                    };
                }
                
                teamsScores[team][match] = 0;
                teamsScores[team].total = (teamsScores[team].match1 || 0) + 
                                            (teamsScores[team].match2 || 0) + 
                                            (teamsScores[team].match3 || 0) + 
                                            (teamsScores[team].match4 || 0);
                currentScore = 0;
                document.getElementById('scoreDisplay').textContent = currentScore;
                
                saveToFirebase();
                alert('✅ ลบคะแนนสำเร็จ!');
            }
        }

        function saveMatch() {
            const groupKey = document.getElementById('matchGroup')?.value;
            const matchNum = document.getElementById('matchNumber')?.value;
            const team1 = document.getElementById('team1Select')?.value;
            const team2 = document.getElementById('team2Select')?.value;
            const winner = document.getElementById('winnerSelect')?.value;

            if (!groupKey || !matchNum || !team1 || !team2) {
                alert('กรุณาเลือกข้อมูลให้ครบ!');
                return;
            }

            if (team1 === team2) {
                alert('ไม่สามารถเลือกทีมเดียวกันได้!');
                return;
            }

            if (!matches[groupKey]) {
                matches[groupKey] = {};
            }

            matches[groupKey][matchNum] = {
                team1: team1,
                team2: team2,
                winner: winner || null
            };

            saveToFirebase();
            updateMatchList();
            alert('✅ บันทึกแมทช์สำเร็จ!');
        }

        function deleteMatch() {
            const groupKey = document.getElementById('matchGroup')?.value;
            const matchNum = document.getElementById('matchNumber')?.value;

            if (!groupKey || !matchNum) {
                alert('กรุณาเลือกกลุ่มและแมทช์!');
                return;
            }

            if (confirm(`ต้องการลบ ${matchNum} ใช่หรือไม่?`)) {
                if (!matches[groupKey]) {
                    matches[groupKey] = {};
                }

                matches[groupKey][matchNum] = {
                    team1: null,
                    team2: null,
                    winner: null
                };

                saveToFirebase();
                updateMatchList();
                alert('✅ ลบแมทช์สำเร็จ!');
            }
        }

        function updateMatchList() {
            const groupKey = document.getElementById('matchGroup')?.value;
            if (!groupKey) return;
            
            updateMatchTeamSelects();
            
            const container = document.getElementById('matchListContainer');
            let html = '<h3 class="text-lg font-bold text-neon-cyan mb-3">รายการแมทช์ทั้งหมด</h3>';

            if (matches[groupKey]) {
                Object.keys(matches[groupKey]).forEach(matchKey => {
                    const match = matches[groupKey][matchKey];
                    if (match && match.team1 && match.team2) {
                        const matchNum = matchKey.replace('match', '');
                        const winnerText = match.winner ? 
                            (match.winner === 'team1' ? `🏆 ${match.team1} ชนะ` : `🏆 ${match.team2} ชนะ`) : 
                            '<span class="text-gray-500">ยังไม่มีผู้ชนะ</span>';
                        
                        html += `
                            <div class="bg-slate-800/50 rounded-lg p-3 mb-3">
                                <div class="text-sm font-bold text-neon-cyan mb-2">Match ${matchNum}</div>
                                <div class="flex items-center justify-between text-sm text-white mb-2">
                                    <span>${match.team1}</span>
                                    <span class="text-gray-500 mx-2">VS</span>
                                    <span>${match.team2}</span>
                                </div>
                                <div class="text-xs text-center ${match.winner ? 'text-win-green' : 'text-gray-500'}">${winnerText}</div>
                            </div>
                        `;
                    }
                });
            }

            container.innerHTML = html;
        }

        function renderQualifierSelection() {
            const container = document.getElementById('qualifierSelection');
            let html = '';

            Object.keys(groupsData).forEach(groupKey => {
                const group = groupsData[groupKey];
                const sortedTeams = [...group.teams].sort((a, b) => {
                    return (teamsScores[b]?.total || 0) - (teamsScores[a]?.total || 0);
                });

                html += `
                    <div class="bg-slate-800/50 rounded-lg p-4">
                        <h4 class="font-bold text-white mb-3">${group.name} - เลือกทีมเข้ารอบ</h4>
                        <div class="space-y-2">
                            ${sortedTeams.map((team, index) => {
                                const isQualified = knockoutData.qualifiers.includes(team);
                                return `
                                    <label class="flex items-center gap-3 cursor-pointer p-2 rounded hover:bg-slate-700/50">
                                        <input type="checkbox" 
                                            ${isQualified ? 'checked' : ''} 
                                            onchange="toggleQualifier('${team}')"
                                            class="w-5 h-5 rounded border-gray-600 text-neon-cyan focus:ring-neon-cyan">
                                        <span class="flex-1 text-white">
                                            <span class="${index === 0 ? 'text-yellow-400' : index === 1 ? 'text-gray-400' : 'text-gray-500'} mr-2">#${index + 1}</span>
                                            ${team}
                                        </span>
                                        <span class="text-sm text-gray-400">${teamsScores[team]?.total || 0} pts</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleQualifier(team) {
            const index = knockoutData.qualifiers.indexOf(team);
            if (index > -1) {
                knockoutData.qualifiers.splice(index, 1);
            } else {
                knockoutData.qualifiers.push(team);
            }
            saveToFirebase();
        }

        function generateKnockoutBracket() {
            if (knockoutData.qualifiers.length < 8) {
                alert('กรุณาเลือกอย่างน้อย 8 ทีมเพื่อเข้ารอบตัดเชือก!');
                return;
            }

            if (knockoutData.qualifiers.length > 8) {
                alert('เลือกได้สูงสุด 8 ทีมเท่านั้น!');
                return;
            }

            // Create quarter finals matches
            knockoutData.quarter = [];
            for (let i = 0; i < 8; i += 2) {
                knockoutData.quarter.push({
                    team1: knockoutData.qualifiers[i],
                    team2: knockoutData.qualifiers[i + 1],
                    winner: null
                });
            }

            // Initialize semi and final
            knockoutData.semi = [
                { team1: null, team2: null, winner: null },
                { team1: null, team2: null, winner: null }
            ];
            knockoutData.final = { team1: null, team2: null, winner: null };
            knockoutData.champion = null;

            saveToFirebase();
            renderKnockoutBracket();
            updateKOMatchSelect();
            alert('✅ สร้างตารางแข่งขันสำเร็จ!');
        }

        function updateKOMatchSelect() {
            const round = document.getElementById('koRound')?.value;
            const matchSelect = document.getElementById('koMatch');
            const winnerSelect = document.getElementById('koWinner');
            
            if (!matchSelect || !winnerSelect || !round) return;

            let matches = [];
            if (round === 'quarter' && knockoutData.quarter) {
                matches = knockoutData.quarter;
            } else if (round === 'semi' && knockoutData.semi) {
                matches = knockoutData.semi;
            } else if (round === 'final' && knockoutData.final) {
                matches = [knockoutData.final];
            }

            matchSelect.innerHTML = matches.map((match, index) => 
                `<option value="${index}">Match ${index + 1}</option>`
            ).join('');

            // Update winner select
            if (matches.length > 0) {
                const matchIndex = parseInt(matchSelect.value) || 0;
                const match = matches[matchIndex];
                winnerSelect.innerHTML = `
                    <option value="">เลือกผู้ชนะ</option>
                    ${match.team1 ? `<option value="${match.team1}">${match.team1}</option>` : ''}
                    ${match.team2 ? `<option value="${match.team2}">${match.team2}</option>` : ''}
                `;
            }
        }

        function saveKnockoutResult() {
            const round = document.getElementById('koRound')?.value;
            const matchIndex = parseInt(document.getElementById('koMatch')?.value);
            const winner = document.getElementById('koWinner')?.value;

            if (!winner) {
                alert('กรุณาเลือกผู้ชนะ!');
                return;
            }

            let match;
            if (round === 'quarter') {
                match = knockoutData.quarter[matchIndex];
                match.winner = winner;

                // Update semi finals
                const semiIndex = Math.floor(matchIndex / 2);
                if (matchIndex % 2 === 0) {
                    knockoutData.semi[semiIndex].team1 = winner;
                } else {
                    knockoutData.semi[semiIndex].team2 = winner;
                }
            } else if (round === 'semi') {
                match = knockoutData.semi[matchIndex];
                match.winner = winner;

                // Update final
                if (matchIndex === 0) {
                    knockoutData.final.team1 = winner;
                } else {
                    knockoutData.final.team2 = winner;
                }
            } else if (round === 'final') {
                match = knockoutData.final;
                match.winner = winner;
                knockoutData.champion = winner;
            }

            saveToFirebase();
            renderKnockoutBracket();
            updateKOMatchSelect();
            alert('✅ บันทึกผลการแข่งขันสำเร็จ!');
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'scores') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('scoresTab').classList.add('active');
            } else if (tab === 'matches') {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('matchesTab').classList.add('active');
                updateMatchList();
            } else if (tab === 'knockout') {
                document.querySelector('.tab:nth-child(3)').classList.add('active');
                document.getElementById('knockoutTab').classList.add('active');
                renderQualifierSelection();
                updateKOMatchSelect();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            const koRound = document.getElementById('koRound');
            const koMatch = document.getElementById('koMatch');
            
            if (koRound) {
                koRound.addEventListener('change', updateKOMatchSelect);
            }
            if (koMatch) {
                koMatch.addEventListener('change', () => {
                    const round = document.getElementById('koRound')?.value;
                    const matchIndex = parseInt(koMatch.value);
                    const winnerSelect = document.getElementById('koWinner');
                    
                    let match;
                    if (round === 'quarter') match = knockoutData.quarter?.[matchIndex];
                    else if (round === 'semi') match = knockoutData.semi?.[matchIndex];
                    else if (round === 'final') match = knockoutData.final;
                    
                    if (match && winnerSelect) {
                        winnerSelect.innerHTML = `
                            <option value="">เลือกผู้ชนะ</option>
                            ${match.team1 ? `<option value="${match.team1}">${match.team1}</option>` : ''}
                            ${match.team2 ? `<option value="${match.team2}">${match.team2}</option>` : ''}
                        `;
                    }
                });
            }
        });

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // Initialize
        window.addEventListener('load', () => {
            initializeFirebase();
        });
    </script>
</body>
</html>
